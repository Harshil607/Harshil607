name: Update Stats

on:
  schedule:
    - cron: "17 */6 * * *"     # every six hours
  workflow_dispatch:            # the "Run workflow" button
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - name: Rebuild live SVGs
        run: python scripts/update_stats.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a classic PAT with read:user (+ repo for private repos)
          # as a repository secret named STATS_TOKEN to count private work too.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit the new SVGs
        run: |
          git config user.name  "stats-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/heatmap.svg
          git diff --staged --quiet || (git commit -m "chore: update live stats" && git push)
